<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение номера телефона</title>
  <!-- Подключаем официальный VK Bridge -->
  <script src="https://unpkg.com"></script>
  <style>
    body {
      margin: 0; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #f2f3f5; display: flex; justify-content: center; align-items: center;
      height: 100vh; text-align: center; color: #222;
    }
    .box {
      background: #fff; padding: 24px; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 360px; width: 100%;
    }
    .loader {
      border: 3px solid #f3f3f3; border-top: 3px solid #2688eb;
      border-radius: 50%; width: 30px; height: 30px;
      animation: spin 1s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #626d7a; margin: 0; }
    .error { color: #e54242; }
  </style>
</head>
<body>

  <div class="box">
    <div id="loading-icon" class="loader"></div>
    <h2 id="title">Авторизация VK ID...</h2>
    <p id="desc">Пожалуйста, подтвердите доступ к номеру телефона в появившемся окне.</p>
  </div>

  <script>
    // 💥 ПОСТОЯННЫЙ АДРЕС ВАШЕГО ВЕБХУКА N8N
    const N8N_URL = 'https://drickquifouruboz.beget.app/webhook/cdf6e608-7de6-439d-b0aa-49330642a3f1';

    // Извлекаем vk_user_id из хэша ссылки (#user_id=123)
    const params = new URLSearchParams(location.hash.slice(1));
    const vkUserId = params.get('user_id');

    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const loaderEl = document.getElementById('loading-icon');

    async function initAuth() {
      try {
        if (window.vkBridge) {
          // Инициализация моста VK
          await window.vkBridge.send('VKWebAppInit');
          
          // 💥 Вызов официальной шторки верификации телефона VK ID
          const data = await window.vkBridge.send('VKWebAppGetPhoneNumber');
          
          if (data && data.phone_number) {
            loaderEl.style.display = 'block';
            titleEl.textContent = 'Сохранение номера…';
            descEl.textContent = 'Связываемся со сценарием n8n.';

            // Отправляем чистый POST-запрос на ваш вебхук
            const response = await fetch(N8N_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                source: 'vk_chat',
                action: 'confirm_phone',
                vk_user_id: vkUserId,
                phone: data.phone_number
              })
            });

            if (response.ok) {
              titleEl.textContent = '🎉 Успешно!';
              descEl.textContent = 'Номер подтвержден. Возвращаем вас в диалог...';
              
              // Закрываем окно вебвио/мини-аппа и возвращаем пользователя в чат
              setTimeout(async () => {
                await window.vkBridge.send('VKWebAppClose', { status: 'success' });
              }, 1200);
            } else {
              throw new Error('n8n вернул ошибку при сохранении');
            }
          }
        } else {
          throw new Error('Окружение ВКонтакте не найдено');
        }
      } catch (error) {
        loaderEl.style.display = 'none';
        titleEl.className = 'error';
        titleEl.textContent = 'Доступ отклонен';
        descEl.textContent = 'Вы не подтвердили номер телефона или произошла ошибка сети. Попробуйте еще раз в боте.';
      }
    }

    // Старт сценария сразу после загрузки страницы
    window.onload = () => {
      if (!vkUserId) {
        loaderEl.style.display = 'none';
        titleEl.textContent = 'Ошибка сессии';
        descEl.textContent = 'Не удалось определить ваш VK ID. Перезайдите по кнопке из бота.';
        return;
      }
      initAuth();
    };
  </script>
</body>
</html>
