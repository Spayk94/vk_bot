
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Запись на услугу</title>

  <link rel="stylesheet" href="https://unpkg.com/air-datepicker@3.5.3/air-datepicker.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 16px 32px;
      background: var(--vkui--color_background, #fff);
      color: var(--vkui--color_text_primary, #222);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container { max-width: 480px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 24px; }

    .subtitle, .status {
      color: var(--vkui--color_text_secondary, #777);
      font-size: 14px;
      line-height: 1.5;
    }

    .subtitle { margin: 0 0 24px; }
    .section-title { margin: 22px 0 12px; font-size: 17px; font-weight: 600; }
    #calendar { min-height: 290px; }

    .times {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .time-button {
      min-height: 44px;
      border: 1px solid #d7d7d7;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font-size: 15px;
      cursor: pointer;
    }

    .time-button.selected {
      border-color: #2688eb;
      background: #2688eb;
      color: #fff;
    }

    .primary-button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 12px;
      background: #2688eb;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled { opacity: .45; cursor: not-allowed; }
    .error { color: #c62828; }
    .hidden { display: none; }
    .air-datepicker { width: 100%; }

    .air-datepicker-cell.disabled-date {
      color: #ccc !important;
      cursor: default !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Запись на услугу</h1>
    <p class="subtitle">Выберите удобную дату и свободное время.</p>

    <div class="section-title">1. Выберите дату</div>
    <div id="calendar"></div>
    <div id="date-status" class="status">Запуск приложения…</div>

    <section id="times-section" class="hidden">
      <div class="section-title">2. Выберите время</div>
      <div id="times" class="times"></div>
      <div id="time-status" class="status"></div>
    </section>

    <button id="confirm-button" class="primary-button" disabled>
      Подтвердить выбор
    </button>
    <div id="general-status" class="status"></div>
  </main>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="https://unpkg.com/air-datepicker@3.5.3/air-datepicker.js"></script>

  <script>
    (() => {
      "use strict";

      const N8N_URL =
        "https://drickquifouruboz.beget.app/webhook/cdf6e608-7de6-439d-b0aa-49330642a3f1";

      const dateStatus = document.getElementById("date-status");
      const timeStatus = document.getElementById("time-status");
      const generalStatus = document.getElementById("general-status");
      const timesSection = document.getElementById("times-section");
      const timesContainer = document.getElementById("times");
      const confirmButton = document.getElementById("confirm-button");

      let availableDates = [];
      let selectedDate = null;
      let selectedTime = null;
      let datepicker = null;
      let requestCounter = 0;

      const launchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, "").replace(/^\?/, "")
      );

      function getLaunchParam(...names) {
        for (const name of names) {
          const value = launchParams.get(name) || hashParams.get(name);
          if (value) return value;
        }
        return null;
      }

      let resolvedUserId = getLaunchParam("vk_user_id", "user_id");
      let resolvedChatId = getLaunchParam("vk_chat_id", "chat_id");

      async function resolveLaunchParams() {
        if (!window.vkBridge?.send) {
          console.warn("[calendar] VK Bridge недоступен");
          return;
        }

        try {
          const params = await window.vkBridge.send(
            "VKWebAppGetLaunchParams"
          );

          resolvedUserId = params.vk_user_id || resolvedUserId;
          resolvedChatId = params.vk_chat_id || resolvedChatId;

          console.log("[calendar] Launch params:", params);
          console.log("[calendar] user_id:", resolvedUserId);
          console.log("[calendar] chat_id:", resolvedChatId);
        } catch (error) {
          console.error("[calendar] Ошибка параметров запуска:", error);
        }
      }

      function setStatus(element, message, isError = false) {
        element.textContent = message || "";
        element.classList.toggle("error", Boolean(isError));
      }

      function normalizeDate(value) {
        if (typeof value !== "string") return null;

        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;

        const [, year, month, day] = match;
        const check = new Date(
          Number(year),
          Number(month) - 1,
          Number(day)
        );

        if (
          check.getFullYear() !== Number(year) ||
          check.getMonth() !== Number(month) - 1 ||
          check.getDate() !== Number(day)
        ) {
          return null;
        }

        return `${year}-${month}-${day}`;
      }

      // Поддерживаем ответ в виде массива:
      // [{ success: true, data: { booking_dates: [...] }, meta: [] }]
      // и в виде обычного объекта с такой же структурой.
      function unwrapResponse(result) {
        if (Array.isArray(result)) {
          return result[0] ?? null;
        }

        return result;
      }

      function findGroupId(response) {
        const result = unwrapResponse(response);
        const candidates = [
          result?.group_id,
          result?.data?.group_id,
          result?.result?.group_id,
          result?.data?.result?.group_id,
          result?.body?.group_id
        ];

        for (const value of candidates) {
          if (value !== undefined && value !== null && String(value).trim() !== "") {
            const digits = String(value).trim().replace(/^-/, "");
            if (/^\d+$/.test(digits)) return digits;
          }
        }

        return null;
      }

      function findArray(data, paths) {
        for (const path of paths) {
          const value = path
            .split(".")
            .reduce((obj, part) => obj?.[part], data);

          if (Array.isArray(value)) return value;
        }

        return [];
      }

      function parseDates(response) {
        const result = unwrapResponse(response);

        if (!result || typeof result !== "object") {
          return [];
        }

        const list = findArray(result, [
          "data.booking_dates",
          "booking_dates",
          "data.working_dates",
          "working_dates",
          "data.dates",
          "dates"
        ]);

        return [...new Set(
          list.map(item => {
            if (typeof item === "string") {
              return normalizeDate(item);
            }

            if (item && typeof item === "object") {
              return normalizeDate(
                item.date ?? item.booking_date ?? item.value
              );
            }

            return null;
          }).filter(Boolean)
        )].sort();
      }

      function parseTimes(response) {
        // Поддерживаем ответ n8n в виде массива из одного объекта:
        // [{ success: true, data: [{ time: "10:00", datetime: "..." }], meta: [] }]
        // а также обычный объект с такой же структурой.
        const result = unwrapResponse(response);

        if (!result || typeof result !== "object") {
          return [];
        }

        // В ответе YCLIENTS список слотов находится непосредственно в data.
        const list = Array.isArray(result.data)
          ? result.data
          : findArray(result, [
              "data.times",
              "data.booking_times",
              "times",
              "booking_times"
            ]);

        return list
          .map(item => {
            if (typeof item === "string") {
              return item;
            }

            if (item && typeof item === "object") {
              return String(item.time ?? item.datetime ?? item.value ?? "");
            }

            return "";
          })
          .filter(Boolean);
      }

      async function requestN8n(action, extra = {}) {
        if (!resolvedUserId) {
          throw new Error(
            "Не удалось определить VK user_id. Откройте приложение через VK."
          );
        }

        const body = new URLSearchParams({
          source: "vk_calendar",
          action,
          user_id: String(resolvedUserId),
          ...extra
        });

        console.log("[calendar] Запрос:", {
          action,
          user_id: resolvedUserId,
          ...extra
        });

        let response;

        try {
          response = await fetch(N8N_URL, {
            method: "POST",
            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"
            },
            body: body.toString()
          });
        } catch (error) {
          throw new Error(
            "Не удалось связаться с n8n. Проверьте подключение и вебхук."
          );
        }

        if (!response.ok) {
          throw new Error(`Ошибка HTTP ${response.status}`);
        }

        const text = await response.text();
        let result;

        try {
          result = JSON.parse(text);
        } catch {
          console.error("[calendar] Ответ не JSON:", text);
          throw new Error(
            "Ответ n8n не является JSON. Проверьте Respond to Webhook."
          );
        }

        console.log("[calendar] Ответ n8n:", result);

        const unwrapped = unwrapResponse(result);

        if (unwrapped?.success === false || unwrapped?.error) {
          throw new Error(
            unwrapped.error || unwrapped.message || "Ошибка n8n"
          );
        }

        return result;
      }

      function updateConfirmButton() {
        confirmButton.disabled = !(selectedDate && selectedTime);
      }

      function clearTimes() {
        selectedTime = null;
        timesContainer.replaceChildren();
        timesSection.classList.add("hidden");
        timeStatus.textContent = "";
        updateConfirmButton();
      }

      async function loadTimes(date) {
        const currentRequest = ++requestCounter;

        selectedDate = date;
        clearTimes();
        timesSection.classList.remove("hidden");
        setStatus(timeStatus, "Загружаем свободное время…");
        updateConfirmButton();

        try {
          const result = await requestN8n("times", { date });

          if (currentRequest !== requestCounter) return;

          const times = parseTimes(result);

          if (!times.length) {
            setStatus(timeStatus, "Свободного времени нет.");
            return;
          }

          setStatus(timeStatus, "Выберите время.");

          times.forEach(time => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "time-button";
            button.textContent = time;

            button.addEventListener("click", () => {
              selectedTime = time;

              timesContainer
                .querySelectorAll(".time-button")
                .forEach(item => {
                  item.classList.toggle("selected", item === button);
                });

              updateConfirmButton();
            });

            timesContainer.appendChild(button);
          });
        } catch (error) {
          if (currentRequest !== requestCounter) return;

          console.error("[calendar] Ошибка загрузки времени:", error);
          setStatus(
            timeStatus,
            `Ошибка загрузки времени: ${error.message}`,
            true
          );
        }
      }

      function renderCalendar(dates) {
        if (typeof window.AirDatepicker !== "function") {
          throw new Error(
            "Библиотека календаря не загрузилась. Обновите страницу."
          );
        }

        if (datepicker) {
          datepicker.destroy();
        }

        const enabledDates = new Set(dates);

        datepicker = new window.AirDatepicker("#calendar", {
          inline: true,
          autoClose: true,
          dateFormat: "yyyy-MM-dd",
          minDate: new Date(),

          onRenderCell({ date, cellType }) {
            if (cellType !== "day") return {};

            const key = [
              date.getFullYear(),
              String(date.getMonth() + 1).padStart(2, "0"),
              String(date.getDate()).padStart(2, "0")
            ].join("-");

            if (!enabledDates.has(key)) {
              return {
                disabled: true,
                classes: "disabled-date"
              };
            }

            return {};
          },

          onSelect({ date, formattedDate }) {
            if (!date) return;

            const value = normalizeDate(
              Array.isArray(formattedDate)
                ? formattedDate[0]
                : formattedDate
            );

            if (!value || !enabledDates.has(value)) return;

            selectedDate = value;
            selectedTime = null;

            setStatus(dateStatus, `Выбрана дата: ${value}`);
            setStatus(generalStatus, "");

            updateConfirmButton();
            loadTimes(value);
          }
        });
      }

      async function loadDates() {
        setStatus(dateStatus, "Получаем доступные даты…");
        confirmButton.disabled = true;

        try {
          const result = await requestN8n("dates");
          const unwrapped = unwrapResponse(result);

          if (!unwrapped || unwrapped.success !== true) {
            throw new Error(
              unwrapped?.message || "Сервер не подтвердил получение дат."
            );
          }

          availableDates = parseDates(result);

          console.log("[calendar] Доступные даты:", availableDates);

          if (!availableDates.length) {
            if (datepicker) {
              datepicker.destroy();
              datepicker = null;
            }

            document.getElementById("calendar").replaceChildren();

            setStatus(
              dateStatus,
              "Нет доступных дат для записи.",
              false
            );
            return;
          }

          renderCalendar(availableDates);
          setStatus(dateStatus, "Выберите доступную дату.");
        } catch (error) {
          console.error("[calendar] Ошибка загрузки дат:", error);

          if (datepicker) {
            datepicker.destroy();
            datepicker = null;
          }

          document.getElementById("calendar").replaceChildren();

          setStatus(
            dateStatus,
            `Не удалось загрузить даты: ${error.message}`,
            true
          );
        }
      }

      confirmButton.addEventListener("click", async () => {
        if (!selectedDate || !selectedTime) return;

        confirmButton.disabled = true;
        setStatus(generalStatus, "Отправляем ваш выбор…");

        try {
          const result = await requestN8n("select", {
            date: selectedDate,
            time: selectedTime
          });

          const unwrapped = unwrapResponse(result);

          // После успешной записи берём group_id из ответа n8n.
          // Автоматический переход не используем: показываем кликабельную ссылку.
          if (unwrapped?.success === true) {
            const groupId = findGroupId(result);
            const successMessage = unwrapped?.message || "Запись успешно подтверждена.";

            generalStatus.replaceChildren();
            generalStatus.classList.remove("error");
            generalStatus.appendChild(document.createTextNode(successMessage));

            if (!groupId) {
              generalStatus.appendChild(document.createElement("br"));
              generalStatus.appendChild(document.createTextNode(
                "Но n8n не вернул group_id, поэтому ссылку на чат сформировать не удалось."
              ));
              generalStatus.classList.add("error");
              return;
            }

            const chatUrl = `https://vk.ru/im?sel=-${groupId}`;
            console.log("[calendar] Ссылка на чат:", chatUrl);

            // После успешного подтверждения та же кнопка превращается в ссылку на чат.
            const chatButton = document.createElement("a");
            chatButton.id = "confirm-button";
            chatButton.className = "primary-button";
            chatButton.href = chatUrl;
            chatButton.textContent = "Вернуться в чат для продолжения";
            chatButton.target = "_blank";
            chatButton.rel = "noopener noreferrer";
            chatButton.style.display = "flex";
            chatButton.style.alignItems = "center";
            chatButton.style.justifyContent = "center";
            chatButton.style.textDecoration = "none";
            confirmButton.replaceWith(chatButton);
            return;
          }

          setStatus(
            generalStatus,
            unwrapped?.message || "Ответ получен, но подтверждение не отмечено как успешное.",
            true
          );
        } catch (error) {
          console.error("[calendar] Ошибка подтверждения:", error);

          setStatus(
            generalStatus,
            `Ошибка: ${error.message}`,
            true
          );
        } finally {
          updateConfirmButton();
        }
      });

      async function startApp() {
        setStatus(dateStatus, "Запускаем календарь…");

        if (window.vkBridge?.send) {
          try {
            await window.vkBridge.send("VKWebAppInit");
          } catch (error) {
            console.warn("[calendar] Ошибка VK Bridge Init:", error);
          }
        }

        await resolveLaunchParams();
        await loadDates();

      }

      function handleStartupError(error) {
        console.error("[calendar] Ошибка запуска приложения:", error);

        setStatus(
          dateStatus,
          `Ошибка запуска: ${error?.message || "неизвестная ошибка"}`,
          true
        );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          startApp().catch(handleStartupError);
        }, { once: true });
      } else {
        startApp().catch(handleStartupError);
      }
    })();
  </script>
</body>
</html>
