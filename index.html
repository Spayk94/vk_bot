<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Выбор даты и времени</title>

  <!-- Подключаем стили -->
  <link rel="stylesheet" href="https://jsdelivr.net">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: var(--vkui--color_background, #f2f3f5);
      color: var(--vkui--color_text_primary, #222);
    }
    .container {
      max-width: 420px; margin: auto; padding: 18px;
      border-radius: 18px; background: #fff;
      box-shadow: 0 3px 16px #0000000a;
    }
    h2 { font-size: 20px; margin: 0 0 16px; }
    h3 { font-size: 16px; margin: 22px 0 12px; }
    #calendar { display: flex; justify-content: center; min-height: 250px; }
    .air-datepicker { width: 100%; border: 0; }
    .air-datepicker-cell.-disabled- { color: #c7c9cc; }
    .air-datepicker-cell.-selected- {
      background: #2688eb !important; color: white !important;
    }
    .status {
      padding: 12px; margin-top: 12px; border-radius: 10px;
      background: #f2f3f5; color: #626d7a; font-size: 14px;
    }
    .slots {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .time-btn {
      padding: 12px 4px; border: 1px solid #dce0e5;
      background: #fff; border-radius: 10px;
      color: #222; font-size: 15px; cursor: pointer;
    }
    .time-btn.active {
      color: #fff; background: #2688eb; border-color: #2688eb;
    }
    .primary {
      width: 100%; padding: 15px; margin-top: 18px;
      border: 0; border-radius: 12px; background: #2688eb;
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .hidden { display: none; }
    .error { color: #c62828; background: #ffebee; }
  </style>
</head>
<body>
  <main class="container">
    <h2>Выберите дату записи</h2>
    <div id="calendar"></div>

    <h3>Доступное время</h3>
    <div id="slots" class="status">
      Связываемся с сервером n8n…
    </div>

    <button id="confirm" class="primary" disabled>
      Выберите время
    </button>
    <div id="message" class="status hidden" role="status"></div>
  </main>

  <!-- Подключаем скрипты в конце body, чтобы они не вешали страницу -->
  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>

  <script>
    const N8N_URL = 'https://beget.app';

    let availableDates = [];
    let selectedDate = null;
    let selectedTime = null;
    let calendar = null;
    let busy = false;

    const slotsEl = document.getElementById('slots');
    const confirmBtn = document.getElementById('confirm');
    const messageEl = document.getElementById('message');

    function showMessage(text, error = false) {
      messageEl.textContent = text;
      messageEl.classList.remove('hidden', 'error');
      if (error) messageEl.classList.add('error');
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Запрос к n8n (обычный чистый POST)
    async function requestN8n(action, extra = {}) {
      try {
        const response = await fetch(N8N_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'vk_calendar', action, ...extra })
        });

        if (!response.ok) {
          return { success: false, message: `Ошибка сервера n8n: HTTP ${response.status}` };
        }
        return await response.json();
      } catch (e) {
        return { success: false, message: 'Запрос заблокирован CORS на Beget или нет сети.' };
      }
    }

    // Шаг 2: Загрузка времени
    async function loadTimes(date) {
      selectedDate = date;
      selectedTime = null;
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Выберите время';
      slotsEl.className = 'status';
      slotsEl.textContent = 'Загружаем свободное время…';

      const result = await requestN8n('times', { date });
      
      if (result.success === false) {
        slotsEl.className = 'status error';
        slotsEl.textContent = result.message || 'Не удалось загрузить время.';
        return;
      }

      const times = result.times || result.data?.times || result.data || [];
      slotsEl.className = 'slots';
      slotsEl.replaceChildren();

      if (!times.length) {
        slotsEl.className = 'status';
        slotsEl.textContent = 'На эту дату свободного времени нет.';
        return;
      }

      times.forEach(item => {
        const time = typeof item === 'string' ? item : item.time;
        if (!time) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-btn';
        btn.textContent = time;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedTime = time;
          confirmBtn.disabled = false;
          confirmBtn.textContent = `Подтвердить ${time}`;
          messageEl.classList.add('hidden');
        });
        slotsEl.appendChild(btn);
      });
    }

    // Шаг 1: Инициализация (Запуск гарантирован!)
    async function startApp() {
      // Инициализируем VK Bridge если он загружен
      if (window.vkBridge) {
        try { await window.vkBridge.send('VKWebAppInit'); } catch(e) {}
      }

      // Если AirDatepicker ещё не прогрузился из сети, ждем 100мс и пробуем снова
      if (typeof AirDatepicker === 'undefined') {
        setTimeout(startApp, 100);
        return;
      }

      // Рендерим календарь сразу (даты заблокированы, пока n8n отвечает)
      calendar = new AirDatepicker('#calendar', {
        inline: true,
        minDate: new Date(),
        dateFormat: 'yyyy-MM-dd',
        onRenderCell({ date, cellType }) {
          if (cellType !== 'day') return;
          if (availableDates.length === 0) return { disabled: true };
          return { disabled: !availableDates.includes(formatDate(date)) };
        },
        onSelect({ date }) {
          if (date) loadTimes(formatDate(date));
        }
      });

      // Делаем первый запрос к твоему n8n за датами YClients
      const result = await requestN8n('dates');
      
      if (result.success === false) {
        slotsEl.className = 'status error';
        slotsEl.textContent = result.message || 'Ошибка получения дат.';
        return;
      }

      availableDates = result.dates || result.data?.dates || result.data || [];

      if (!availableDates.length) {
        slotsEl.className = 'status';
        slotsEl.textContent = 'Нет доступных дат для записи от YClients.';
        return;
      }

      // Обновляем календарь полученными датами, открывая дни
      calendar.update();
      slotsEl.className = 'status';
      slotsEl.textContent = 'Выберите доступную дату в календаре.';
    }

    // Шаг 3: Клик по кнопке «Подтвердить»
    confirmBtn.addEventListener('click', async () => {
      if (busy || !selectedDate || !selectedTime) return;

      busy = true;
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Сохраняем выбор…';

      const result = await requestN8n('select', { date: selectedDate, time: selectedTime });

      if (result.success !== true) {
        busy = false;
        confirmBtn.disabled = false;
        confirmBtn.textContent = `Подтвердить ${selectedTime}`;
        showMessage(result.message || 'Ошибка сохранения. Попробуйте еще раз.', true);
        return;
      }

      showMessage('Запись успешно оформлена! Возвращаемся в чат…');
      if (window.vkBridge) {
        try { await window.vkBridge.send('VKWebAppClose', { status: 'success' }); } catch(e) {}
      }
    });

    // Запускаем приложение после загрузки окна окна со всеми библиотеками
    window.onload = startApp;
  </script>
</body>
</html>
