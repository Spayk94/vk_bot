<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Выбор даты и времени</title>

  <script src="https://unpkg.com"></script>
  <link rel="stylesheet" href="https://jsdelivr.net">
  <script src="https://jsdelivr.net"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: var(--vkui--color_background, #f2f3f5);
      color: var(--vkui--color_text_primary, #222);
    }
    .container {
      max-width: 420px; margin: auto; padding: 18px;
      border-radius: 18px; background: #fff;
      box-shadow: 0 3px 16px #0000000a;
    }
    h2 { font-size: 20px; margin: 0 0 16px; }
    h3 { font-size: 16px; margin: 22px 0 12px; }
    #calendar { display: flex; justify-content: center; }
    .air-datepicker { width: 100%; border: 0; }
    .air-datepicker-cell.-disabled- { color: #c7c9cc; }
    .air-datepicker-cell.-selected- {
      background: #2688eb !important; color: white !important;
    }
    .status {
      padding: 12px; margin-top: 12px; border-radius: 10px;
      background: #f2f3f5; color: #626d7a; font-size: 14px;
    }
    .slots {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .time-btn {
      padding: 12px 4px; border: 1px solid #dce0e5;
      background: #fff; border-radius: 10px;
      color: #222; font-size: 15px; cursor: pointer;
    }
    .time-btn.active {
      color: #fff; background: #2688eb; border-color: #2688eb;
    }
    .primary {
      width: 100%; padding: 15px; margin-top: 18px;
      border: 0; border-radius: 12px; background: #2688eb;
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .hidden { display: none; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <main class="container">
    <h2>Выберите дату записи</h2>
    <div id="calendar"></div>

    <h3>Доступное время</h3>
    <div id="slots" class="status">
      Загружаем доступные даты…
    </div>

    <button id="confirm" class="primary" disabled>
      Выберите время
    </button>
    <div id="message" class="status hidden" role="status"></div>
  </main>

  <script>
    const N8N_URL = 'https://drickquifouruboz.beget.app/webhook/cdf6e608-7de6-439d-b0aa-49330642a3f1';

    const params = new URLSearchParams(location.hash.slice(1));
    const staffId = params.get('staff_id');
    const serviceIds = (params.get('service_ids') || '').split(',').map(x => x.trim()).filter(Boolean);
    const vkBridge = window.vkBridge;

    let availableDates = [];
    let selectedDate = null;
    let selectedTime = null;
    let calendar = null;
    let busy = false;

    const slotsEl = document.getElementById('slots');
    const confirmBtn = document.getElementById('confirm');
    const messageEl = document.getElementById('message');

    function showMessage(text, error = false) {
      messageEl.textContent = text;
      messageEl.classList.remove('hidden', 'error');
      if (error) messageEl.classList.add('error');
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // Универсальная функция запроса к вашему вебхуку n8n
    async function requestN8n(action, extra = {}) {
      const response = await fetch(N8N_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source: 'vk_calendar',
          action,
          staff_id: staffId,
          service_ids: serviceIds,
          ...extra
        })
      });

      if (!response.ok) {
        throw new Error(`Ошибка n8n: HTTP ${response.status}`);
      }

      const result = await response.json();
      if (result.success === false) {
        throw new Error(result.message || 'Не удалось выполнить запрос');
      }
      return result;
    }

    // 2️⃣ Второй шаг: Запрос слотов времени для выбранной даты
    async function loadTimes(date) {
      selectedDate = date;
      selectedTime = null;
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Выберите время';
      slotsEl.className = 'status';
      slotsEl.textContent = 'Загружаем свободное время…';

      try {
        // Отправляем запрос на вебхук с выбранной датой
        const result = await requestN8n('times', { date });
        
        // Ожидаем от n8n массив строк вида ["10:00", "11:30"] либо внутри data
        const times = result.times || result.data?.times || result.data || [];

        slotsEl.className = 'slots';
        slotsEl.replaceChildren();

        if (!times.length) {
          slotsEl.className = 'status';
          slotsEl.textContent = 'На эту дату свободного времени нет.';
          return;
        }

        times.forEach(item => {
          const time = typeof item === 'string' ? item : item.time;
          if (!time) return;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'time-btn';
          btn.textContent = time;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTime = time;
            confirmBtn.disabled = false;
            confirmBtn.textContent = `Подтвердить ${time}`;
            messageEl.classList.add('hidden');
          });
          slotsEl.appendChild(btn);
        });

        if (!slotsEl.children.length) {
          slotsEl.className = 'status';
          slotsEl.textContent = 'Нет доступных слотов.';
        }
      } catch (error) {
        slotsEl.className = 'status error';
        slotsEl.textContent = 'Не удалось загрузить время. Попробуйте ещё раз.';
      }
    }

    // 1️⃣ Первый шаг: Запуск при открытии приложения
    async function init() {
      try {
        if (vkBridge) {
          await vkBridge.send('VKWebAppInit');
        }

        if (!staffId || !serviceIds.length) {
          throw new Error('Не переданы мастер или услуги.');
        }

        // Запрашиваем у n8n список доступных для записи дат
        const result = await requestN8n('dates');
        
        // Ожидаем от n8n массив строк вида ["2026-10-25", "2026-10-26"]
        availableDates = result.dates || result.data?.dates || result.data || [];

        if (!availableDates.length) {
          slotsEl.className = 'status';
          slotsEl.textContent = 'Нет доступных дат для записи.';
          return;
        }

        // Рендерим календарь, разблокируя только даты из ответа n8n
        calendar = new AirDatepicker('#calendar', {
          inline: true,
          minDate: new Date(),
          dateFormat: 'yyyy-MM-dd',
          onRenderCell({ date, cellType }) {
            if (cellType !== 'day') return;
            return { disabled: !availableDates.includes(formatDate(date)) };
          },
          onSelect({ date }) {
            // При клике на разблокированную дату запускаем шаг 2
            if (date) loadTimes(formatDate(date));
          }
        });

        slotsEl.className = 'status';
        slotsEl.textContent = 'Выберите доступную дату в календаре.';
      } catch (error) {
        slotsEl.className = 'status error';
        slotsEl.textContent = error.message || 'Не удалось загрузить даты. Попробуйте позже.';
      }
    }

    // 3️⃣ Третий шаг: Клик по кнопке «Подтвердить»
    confirmBtn.addEventListener('click', async () => {
      if (busy || !selectedDate || !selectedTime) return;

      busy = true;
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Сохраняем выбор…';
      messageEl.classList.add('hidden');

      try {
        // Отправляем финальные данные для записи в таблицу
        const result = await requestN8n('select', {
          date: selectedDate,
          time: selectedTime
        });

        if (result.success !== true) {
          throw new Error('n8n не подтвердил сохранение выбора.');
        }

        showMessage('Дата и время сохранены. Возвращаемся в чат…');
        if (vkBridge) {
          await vkBridge.send('VKWebAppClose', { status: 'success' });
        }
      } catch (error) {
        busy = false;
        confirmBtn.disabled = false;
        confirmBtn.textContent = `Подтвердить ${selectedTime}`;
        showMessage(error.message || 'Ошибка сохранения. Повторите попытку.', true);
      }
    });

    // Автоматический старт первого шага при открытии страницы
    init();
  </script>
</body>
</html>
