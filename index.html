
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#ffffff">
  <title>Запись на услугу</title>

  <!-- VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Air Datepicker -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/air-datepicker@3.5.3/air-datepicker.css"
  >
  <script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.5.3/air-datepicker.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px 32px;
      background: var(--vkui--color_background, #ffffff);
      color: var(--vkui--color_text_primary, #222222);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--vkui--color_text_secondary, #777777);
      font-size: 14px;
      line-height: 1.5;
    }

    .section-title {
      margin: 22px 0 12px;
      font-size: 17px;
      font-weight: 600;
    }

    #calendar {
      min-height: 290px;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .time-button {
      min-height: 44px;
      border: 1px solid #d7d7d7;
      border-radius: 10px;
      background: #ffffff;
      color: #222222;
      font-size: 15px;
      cursor: pointer;
    }

    .time-button.selected {
      border-color: #2688eb;
      background: #2688eb;
      color: #ffffff;
    }

    .time-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin: 12px 0;
      color: var(--vkui--color_text_secondary, #777777);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .error {
      color: #c62828;
    }

    .primary-button {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 12px;
      background: #2688eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .air-datepicker {
      width: 100%;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Запись на услугу</h1>
    <p class="subtitle">Выберите удобную дату и свободное время.</p>

    <div class="section-title">1. Выберите дату</div>
    <div id="calendar"></div>

    <div id="date-status" class="status">Загружаем доступные даты…</div>

    <section id="times-section" class="hidden">
      <div class="section-title">2. Выберите время</div>
      <div id="times" class="times"></div>
      <div id="time-status" class="status"></div>
    </section>

    <button id="confirm-button" class="primary-button" disabled>
      Подтвердить выбор
    </button>

    <div id="general-status" class="status"></div>
  </main>

  <script>
    (() => {
      "use strict";

      // Существующий production webhook n8n.
      const N8N_URL =
        "https://drickquifouruboz.beget.app/webhook/cdf6e608-7de6-439d-b0aa-49330642a3f1";

      const dateStatus = document.getElementById("date-status");
      const timeStatus = document.getElementById("time-status");
      const generalStatus = document.getElementById("general-status");
      const timesSection = document.getElementById("times-section");
      const timesContainer = document.getElementById("times");
      const confirmButton = document.getElementById("confirm-button");

      let availableDates = [];
      let selectedDate = null;
      let selectedTime = null;
      let datepicker = null;
      let requestCounter = 0;

      function setStatus(element, message, isError = false) {
        element.textContent = message || "";
        element.classList.toggle("error", Boolean(isError));
      }

      function normalizeDate(value) {
        if (typeof value !== "string") return null;

        // Поддерживаем YYYY-MM-DD и ISO-даты.
        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!match) return null;

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const date = new Date(year, month - 1, day);

        if (
          date.getFullYear() !== year ||
          date.getMonth() !== month - 1 ||
          date.getDate() !== day
        ) {
          return null;
        }

        return `${match[1]}-${match[2]}-${match[3]}`;
      }

      function parseResponseDates(data) {
        const candidates = [
          data?.dates,
          data?.data?.dates,
          data?.booking_dates,
          data?.data?.booking_dates
        ];

        const list = candidates.find(Array.isArray);
        if (!list) return [];

        return [...new Set(
          list
            .map(item => {
              if (typeof item === "string") return normalizeDate(item);

              if (item && typeof item === "object") {
                return normalizeDate(
                  item.date ?? item.booking_date ?? item.value
                );
              }

              return null;
            })
            .filter(Boolean)
        )].sort();
      }

      function parseResponseTimes(data) {
        const candidates = [
          data?.times,
          data?.data?.times,
          data?.booking_times,
          data?.data?.booking_times
        ];

        const list = candidates.find(Array.isArray);
        if (!list) return [];

        return list
          .map(item => {
            if (typeof item === "string") return item;

            if (item && typeof item === "object") {
              return String(
                item.time ?? item.datetime ?? item.value ?? ""
              );
            }

            return "";
          })
          .filter(Boolean);
      }

      async function requestN8n(action, extra = {}) {
        const body = new URLSearchParams({
          source: "vk_calendar",
          action,
          ...extra
        });

        console.log("[calendar] Отправляем запрос:", {
          url: N8N_URL,
          action,
          ...extra
        });

        const response = await fetch(N8N_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: body.toString()
        });

        if (!response.ok) {
          throw new Error(`n8n вернул HTTP ${response.status}`);
        }

        const text = await response.text();

        let result;
        try {
          result = JSON.parse(text);
        } catch {
          throw new Error(
            "Ответ n8n не является JSON. Проверь Respond to Webhook."
          );
        }

        console.log("[calendar] Ответ n8n:", result);

        if (result?.success === false || result?.error) {
          throw new Error(
            result.error || result.message || "n8n вернул ошибку"
          );
        }

        return result;
      }

      function updateConfirmButton() {
        confirmButton.disabled = !(selectedDate && selectedTime);
      }

      function clearTimes() {
        selectedTime = null;
        timesContainer.replaceChildren();
        timesSection.classList.add("hidden");
        timeStatus.textContent = "";
        updateConfirmButton();
      }

      function renderTimes(times) {
        timesContainer.replaceChildren();

        if (!times.length) {
          setStatus(timeStatus, "На эту дату свободного времени нет.");
          return;
        }

        setStatus(timeStatus, "Выберите свободное время.");

        times.forEach(time => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "time-button";
          button.textContent = time;

          button.addEventListener("click", () => {
            selectedTime = time;

            timesContainer.querySelectorAll(".time-button").forEach(item => {
              item.classList.toggle("selected", item === button);
            });

            updateConfirmButton();
          });

          timesContainer.appendChild(button);
        });
      }

      async function loadTimes(date) {
        const currentRequest = ++requestCounter;

        selectedDate = date;
        clearTimes();

        timesSection.classList.remove("hidden");
        setStatus(timeStatus, "Загружаем свободное время…");

        try {
          const result = await requestN8n("times", { date });

          if (currentRequest !== requestCounter) return;

          const times = parseResponseTimes(result);
          renderTimes(times);
        } catch (error) {
          if (currentRequest !== requestCounter) return;

          setStatus(
            timeStatus,
            `Не удалось загрузить время: ${error.message}`,
            true
          );
        }
      }

      function renderCalendar(dates) {
        if (typeof AirDatepicker === "undefined") {
          throw new Error("Не загрузился календарь Air Datepicker.");
        }

        if (datepicker) {
          datepicker.destroy();
        }

        const enabledDates = new Set(dates);

        datepicker = new AirDatepicker("#calendar", {
          inline: true,
          autoClose: true,
          dateFormat: "yyyy-MM-dd",
          minDate: new Date(),
          onRenderCell({ date, cellType }) {
            if (cellType !== "day") return {};

            const key = [
              date.getFullYear(),
              String(date.getMonth() + 1).padStart(2, "0"),
              String(date.getDate()).padStart(2, "0")
            ].join("-");

            if (!enabledDates.has(key)) {
              return {
                disabled: true,
                classes: "disabled-date"
              };
            }

            return {};
          },
          onSelect({ date, formattedDate }) {
            if (!date) return;

            const normalized = normalizeDate(
              Array.isArray(formattedDate)
                ? formattedDate[0]
                : formattedDate
            );

            if (!normalized || !enabledDates.has(normalized)) return;

            setStatus(dateStatus, `Выбрана дата: ${normalized}`);
            loadTimes(normalized);
          }
        });
      }

      async function loadDates() {
        setStatus(dateStatus, "Загружаем доступные даты…");

        try {
          // staff_id и service_ids календарь не передаёт.
          // n8n получает их самостоятельно из своей таблицы.
          const result = await requestN8n("dates");

          availableDates = parseResponseDates(result);

          if (!availableDates.length) {
            setStatus(
              dateStatus,
              "n8n ответил, но список дат пустой. Проверь формат ответа и данные YCLIENTS.",
              true
            );
            return;
          }

          renderCalendar(availableDates);
          setStatus(dateStatus, "Выберите одну из доступных дат.");
        } catch (error) {
          console.error("[calendar] Ошибка загрузки дат:", error);

          setStatus(
            dateStatus,
            `Не удалось загрузить даты: ${error.message}`,
            true
          );
        }
      }

      confirmButton.addEventListener("click", async () => {
        if (!selectedDate || !selectedTime) return;

        confirmButton.disabled = true;
        setStatus(generalStatus, "Отправляем ваш выбор…");

        try {
          const result = await requestN8n("select", {
            date: selectedDate,
            time: selectedTime
          });

          setStatus(
            generalStatus,
            result.message || "Выбор отправлен. Следуйте дальнейшим инструкциям."
          );
        } catch (error) {
          setStatus(
            generalStatus,
            `Не удалось отправить выбор: ${error.message}`,
            true
          );
        } finally {
          updateConfirmButton();
        }
      });

      async function startApp() {
        try {
          if (window.vkBridge?.send) {
            await window.vkBridge.send("VKWebAppInit");
          }
        } catch (error) {
          console.warn("[calendar] VK Bridge не инициализирован:", error);
        }

        await loadDates();
      }

      document.addEventListener("DOMContentLoaded", startApp);
    })();
  </script>
</body>
</html>
